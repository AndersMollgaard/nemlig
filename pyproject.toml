[project]
name = "nemlig"
version = "0.1.0"
description = "Unofficial Python client for nemlig.com: search products and manage the basket"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemlig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to the real nemlig.com with the .env account (set NEMLIG_LIVE=1)"]

[tool.ruff]
line-length = 110
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
