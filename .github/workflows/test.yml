# Offline tests on Linux and Windows. The live tests need .env and skip themselves here.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
      - if: runner.os == 'Linux'
        run: uv run ruff check . && uv run ruff format --check .
